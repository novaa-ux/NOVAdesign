<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NOVA DESIGN | OFFICIAL AGENCY</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollToPlugin.min.js"></script>
    <style>
        :root { --bg-color: #F8FAFC; --text-color: #0F172A; --accent-color: #0066FF; --white: #FFFFFF; }
        body.dark { --bg-color: #0F172A; --text-color: #F8FAFC; --accent-color: #38bdf8; }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); transition: 0.5s; overflow-x: hidden; }

        /* Navigation */
        nav { padding: 1.5rem 5%; display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid rgba(0,0,0,0.1); }
        .nav-links { display: flex; gap: 15px; align-items: center; }
        .fb-link { text-decoration: none; color: var(--text-color); font-weight: bold; border: 1px solid var(--text-color); padding: 8px 15px; border-radius: 20px; font-size: 0.9rem; }

        /* Hero */
        .hero { min-height: 50vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; }
        h1 { font-size: 2.5rem; line-height: 1.1; margin-bottom: 1rem; }

        /* Form */
        #pricing-section { padding: 40px 5%; }
        .contact-form { max-width: 600px; margin: 0 auto; padding: 2rem; background: rgba(128,128,128,0.05); border-radius: 20px; }
        input, select, textarea { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 10px; border: 1px solid #64748B; background: transparent; color: var(--text-color); font-size: 1rem; }
        .btn-submit { background: var(--accent-color); color: white; padding: 12px 25px; border: none; border-radius: 50px; cursor: pointer; width: 100%; font-weight: bold; }

        /* Desktop Adjustments */
        @media (min-width: 768px) {
            h1 { font-size: 5rem; }
            nav { padding: 1.5rem 10%; }
        }
    </style>
</head>
<body>

    <nav>
        <div style="font-size: 1.5rem; font-weight: 900;">NOVA.</div>
        <div class="nav-links">
            <a href="https://www.facebook.com/share/1G1yNLefUV/" target="_blank" class="fb-link">Facebook</a>
            <button onclick="document.body.classList.toggle('dark')" style="padding: 8px 15px; border-radius: 20px; cursor: pointer;">Mode</button>
        </div>
    </nav>

    <section class="hero">
        <h1 id="hero-title">WE DESIGN BRANDS.</h1>
    </section>

    <section id="pricing-section">
        <form id="contactForm" class="contact-form">
            <label>Select your package:</label>
            <select name="Package">
                <option value="Basic">Basic Package</option>
                <option value="Standard">Standard Package</option>
                <option value="Premium">Premium Package</option>
            </select>
            
            <input type="hidden" name="Service" value="Inquiry">
            <input type="text" name="Name" placeholder="Full Name" required>
            <input type="tel" name="WhatsApp" placeholder="WhatsApp Number" required>
            <textarea name="Details" placeholder="Project Details" rows="4"></textarea>
            <button type="submit" class="btn-submit">Send Message</button>
        </form>
    </section>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwXpcCrjT4iTld2UYdmJksa4K5d47f9Gcc183PRimhbxOVgOI843mYOf2CIq0ccAkxcvA/exec";

        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = this.querySelector('button');
            btn.innerText = "Sending...";
            fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: new FormData(this) })
            .then(() => { alert('تم الإرسال بنجاح!'); this.reset(); btn.innerText = "Send Message"; })
            .catch(() => { alert('تم الإرسال!'); this.reset(); btn.innerText = "Send Message"; });
        });
    </script>
</body>
</html>
