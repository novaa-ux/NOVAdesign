<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVA DESIGN | OFFICIAL AGENCY</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollToPlugin.min.js"></script>
    
    <style>
        :root {
            --bg-color: #F8FAFC;
            --text-color: #0F172A;
            --accent-color: #0066FF;
            --white: #FFFFFF;
            --black: #000000;
            --glass: rgba(255, 255, 255, 0.8);
        }

        body.dark {
            --bg-color: #0F172A;
            --text-color: #F8FAFC;
            --accent-color: #38bdf8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; cursor: none; }
        body { background-color: var(--bg-color); color: var(--text-color); transition: 0.5s; overflow-x: hidden; }

        #loader { position: fixed; inset: 0; background-color: var(--accent-color); display: flex; align-items: center; justify-content: center; z-index: 9999; color: var(--white); font-size: 3rem; font-weight: 900; }
        #design-robot { position: fixed; font-size: 2rem; z-index: 999; pointer-events: none; }
        .cursor { position: fixed; width: 20px; height: 20px; border: 2px solid var(--accent-color); border-radius: 50%; pointer-events: none; z-index: 9999; }

        nav { padding: 1.5rem 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: var(--glass); backdrop-filter: blur(10px); z-index: 1000; }
        
        .hero { min-height: 60vh; display: flex; flex-direction: column; justify-content: center; padding: 0 5%; }
        .hero h1 { font-size: 5rem; line-height: 0.9; font-weight: 800; margin-bottom: 2rem; }

        .services-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; padding: 0 5%; }
        .service-card { padding: 2rem; background: rgba(128, 128, 128, 0.05); border: 1px solid rgba(128, 128, 128, 0.1); border-radius: 20px; transition: 0.3s; cursor: pointer; text-align: left; }
        .service-card:hover { background-color: var(--accent-color); color: var(--white); transform: translateY(-5px); }

        #pricing-section { padding: 40px 5%; }
        .contact-form { display: grid; grid-template-columns: 1fr; gap: 1.5rem; max-width: 900px; background: rgba(128,128,128,0.05); padding: 2rem; border-radius: 20px; }
        input, textarea, select { padding: 1rem; border-radius: 10px; border: 1px solid #64748B; background: transparent; color: var(--text-color); width: 100%; }
        .btn-submit { background: var(--accent-color); color: white; padding: 1rem 2rem; border: none; border-radius: 50px; font-weight: 700; cursor: pointer; }

        /* موبايل ريسبونسيف */
        @media (min-width: 768px) {
            .contact-form { grid-template-columns: 1fr 1fr; }
            .hero h1 { font-size: 7rem; }
        }

        .marquee-inner { display: flex; gap: 2rem; width: max-content; animation: scroll 60s linear infinite; }
        .comment-card { min-width: 250px; background: var(--white); color: var(--black); padding: 1.5rem; border-radius: 15px; }
        @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
    </style>
</head>
<body>

    <div id="loader">NOVA DESIGN</div>
    <div id="design-robot">🤖</div>
    <div class="cursor"></div>

    <nav>
        <div style="font-size: 1.5rem; font-weight: 900;">NOVA.</div>
        <button class="btn-submit" onclick="document.body.classList.toggle('dark')" style="padding: 5px 15px;">Mode</button>
    </nav>

    <section class="hero">
        <h1 id="hero-title">WE DESIGN BRANDS.</h1>
        <p style="font-size: 1.2rem;">Professional Agency based in Cairo, Egypt.</p>
    </section>

    <section id="services">
        <h2 style="padding: 0 5%; margin-bottom: 2rem;">Our Services</h2>
        <div class="services-grid">
            <button class="service-card" onclick="scrollToPricing('Identity Design')"><h3>Identity Design</h3><p>Logo & Brand Guidelines.</p></button>
            <button class="service-card" onclick="scrollToPricing('Web Design')"><h3>Web Design</h3><p>UI/UX for Web & Apps.</p></button>
            <button class="service-card" onclick="scrollToPricing('Packaging')"><h3>Packaging</h3><p>Retail & Product Solutions.</p></button>
            <button class="service-card" onclick="scrollToPricing('Art Direction')"><h3>Art Direction</h3><p>Visual Strategy & Creative.</p></button>
        </div>
    </section>

    <section id="pricing-section">
        <h2 id="pricing-title">Start your project</h2>
        <form id="contactForm" class="contact-form">
            <div style="grid-column: 1 / -1;">
                <label style="display:block; margin-bottom:10px; font-weight:bold;">Select your package:</label>
                <select name="Package" id="package-select">
                    <option value="Basic">Basic Package</option>
                    <option value="Standard">Standard Package</option>
                    <option value="Premium">Premium Package</option>
                </select>
            </div>
            <input type="hidden" name="Service" id="hidden-service-field">
            <div class="form-group"><input type="text" name="Name" placeholder="Full Name" required></div>
            <div class="form-group"><input type="email" name="Email" placeholder="Work Email" required></div>
            <div class="form-group" style="grid-column: 1 / -1;"><textarea name="Details" placeholder="Project Details" rows="4"></textarea></div>
            <button type="submit" class="btn-submit">Send Message</button>
        </form>
    </section>

    <script>
        window.addEventListener('load', () => gsap.to('#loader', { y: '-100%', duration: 1.5 }));
        document.addEventListener('mousemove', (e) => gsap.to('.cursor', { x: e.clientX - 10, y: e.clientY - 10, duration: 0.1 }));
        
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwXpcCrjT4iTld2UYdmJksa4K5d47f9Gcc183PRimhbxOVgOI843mYOf2CIq0ccAkxcvA/exec";

        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = this.querySelector('button');
            btn.innerText = "Sending...";
            fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: new FormData(this) })
            .then(() => { alert('تم استلام طلبك بنجاح!'); this.reset(); btn.innerText = "Send Message"; })
            .catch(() => { alert('تم إرسال الطلب!'); this.reset(); btn.innerText = "Send Message"; });
        });

        function scrollToPricing(service) {
            document.getElementById('pricing-title').innerText = "Start: " + service;
            document.getElementById('hidden-service-field').value = service;
            gsap.to(window, { duration: 1, scrollTo: { y: "#pricing-section", offsetY: 20 }, ease: "power4.inOut" });
        }
    </script>
</body>
</html>
