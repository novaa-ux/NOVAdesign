<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVA DESIGN | OFFICIAL AGENCY</title>
    <!-- مكتبات GSAP والـ ScrollTo -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollToPlugin.min.js"></script>
    
    <style>
        :root {
            --bg-color: #F8FAFC;
            --text-color: #0F172A;
            --accent-color: #0066FF;
            --white: #FFFFFF;
            --black: #000000;
            --glass: rgba(255, 255, 255, 0.8);
        }

        body.dark {
            --bg-color: #0F172A;
            --text-color: #F8FAFC;
            --accent-color: #38bdf8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; cursor: none; }
        body { background-color: var(--bg-color); color: var(--text-color); transition: 0.5s; overflow-x: hidden; }

        /* Loader & Elements */
        #loader { position: fixed; inset: 0; background-color: var(--accent-color); display: flex; align-items: center; justify-content: center; z-index: 9999; color: var(--white); font-size: 3rem; font-weight: 900; }
        #design-robot { position: fixed; font-size: 2.5rem; z-index: 999; pointer-events: none; }
        .cursor { position: fixed; width: 20px; height: 20px; border: 2px solid var(--accent-color); border-radius: 50%; pointer-events: none; z-index: 9999; transition: transform 0.1s ease; }

        /* Navigation */
        nav { padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: var(--glass); backdrop-filter: blur(10px); z-index: 1000; border-bottom: 1px solid rgba(128,128,128,0.1); }
        .nav-links { display: flex; gap: 1rem; align-items: center; }
        
        /* Hero */
        .hero { min-height: 70vh; display: flex; flex-direction: column; justify-content: center; padding: 0 5%; text-align: center; }
        .hero h1 { font-size: 4rem; line-height: 0.9; font-weight: 800; margin-bottom: 2rem; }
        .hero p { font-size: 1.2rem; }

        /* Services Grid */
        .services-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; padding: 0 5%; }
        .service-card { padding: 2.5rem; background: rgba(128, 128, 128, 0.05); border: 1px solid rgba(128, 128, 128, 0.1); border-radius: 20px; transition: 0.3s; cursor: pointer; text-align: left; color: var(--text-color); }
        .service-card:hover { background-color: var(--accent-color); color: var(--white); transform: translateY(-5px); }

        /* Form Section */
        #pricing-section { padding: 60px 5%; }
        .contact-form { display: grid; grid-template-columns: 1fr; gap: 1.5rem; max-width: 900px; background: rgba(128,128,128,0.05); padding: 2rem; border-radius: 20px; margin: 0 auto; }
        input, textarea, select { padding: 1.2rem; border-radius: 10px; border: 1px solid #64748B; background: transparent; color: var(--text-color); width: 100%; font-size: 1rem; }
        .btn-submit { background: var(--accent-color); color: white; padding: 1rem 2rem; border: none; border-radius: 50px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .btn-submit:hover { opacity: 0.8; }

        /* الفيسبوك في الـ Nav */
        .fb-link { color: var(--text-color); text-decoration: none; font-weight: bold; border: 1px solid var(--text-color); padding: 8px 15px; border-radius: 20px; transition: 0.3s; }
        .fb-link:hover { background: var(--text-color); color: var(--bg-color); }

        /* موبايل ريسبونسيف */
        @media (min-width: 768px) {
            nav { padding: 2rem 10%; }
            .hero { text-align: left; padding: 0 10%; }
            .hero h1 { font-size: 7rem; }
            .services-grid { padding: 0 10%; }
            #pricing-section { padding: 80px 10%; }
            .contact-form { grid-template-columns: 1fr 1fr; padding: 3rem; }
            .contact-form > *:first-child, .contact-form > textarea, .contact-form > button { grid-column: span 2; }
        }

        /* Marquee */
        .marquee-inner { display: flex; gap: 2rem; width: max-content; animation: scroll 120s linear infinite; }
        .comment-card { min-width: 300px; background: var(--white); color: var(--black); padding: 1.5rem; border-radius: 15px; }
        @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
    </style>
</head>
<body>

    <div id="loader">NOVA DESIGN</div>
    <div id="design-robot">🤖</div>
    <div class="cursor"></div>

    <nav>
        <div style="font-size: 1.8rem; font-weight: 900;">NOVA.</div>
        <div class="nav-links">
            <!-- رابط الفيسبوك هنا -->
            <a href="https://www.facebook.com/share/1G1yNLefUV/" target="_blank" class="fb-link">Facebook</a>
            <button class="btn-submit" onclick="document.body.classList.toggle('dark')" style="padding: 10px 20px;">Mode</button>
        </div>
    </nav>

    <section class="hero">
        <h1 id="hero-title">WE DESIGN BRANDS.</h1>
        <p>Professional Agency based in Cairo, Egypt.</p>
    </section>

    <section id="services">
        <h2 style="padding: 0 5%; margin-bottom: 2rem;">Our Services</h2>
        <div class="services-grid">
            <button class="service-card" onclick="scrollToPricing('Identity Design')"><h3>Identity Design</h3><p>Logo & Brand Guidelines.</p></button>
            <button class="service-card" onclick="scrollToPricing('Web Design')"><h3>Web Design</h3><p>UI/UX for Web & Apps.</p></button>
            <button class="service-card" onclick="scrollToPricing('Packaging')"><h3>Packaging</h3><p>Retail & Product Solutions.</p></button>
            <button class="service-card" onclick="scrollToPricing('Art Direction')"><h3>Art Direction</h3><p>Visual Strategy & Creative.</p></button>
        </div>
    </section>

    <section id="pricing-section">
        <h2 id="pricing-title">Start your project</h2>
        <form id="contactForm" class="contact-form">
            <!-- اختيار الباقة -->
            <div>
                <label style="display:block; margin-bottom:10px; font-weight:bold;">Select your package:</label>
                <select name="Package" id="package-select">
                    <option value="Basic">Basic Package</option>
                    <option value="Standard">Standard Package</option>
                    <option value="Premium">Premium Package</option>
                </select>
            </div>
            
            <!-- حقول مخفية للربط -->
            <input type="hidden" name="Service" id="hidden-service-field">
            
            <div class="form-group"><input type="text" name="Name" placeholder="Full Name" required></div>
            
            <!-- تم تعديل الخانة من Email لـ WhatsApp -->
            <div class="form-group"><input type="tel" name="WhatsApp" placeholder="WhatsApp Number" required></div>
            
            <textarea name="Details" placeholder="Project Details (Optional)" rows="6"></textarea>
            <button type="submit" class="btn-submit">Send Message</button>
        </form>
    </section>

    <section>
        <h2 style="padding: 0 5%;">Client Voices</h2>
        <div style="width: 100%; overflow: hidden; padding: 50px 0;">
            <div class="marquee-inner" id="marquee-box"></div>
        </div>
    </section>

    <script>
        // 1. Initial Animations
        window.addEventListener('load', () => gsap.to('#loader', { y: '-100%', duration: 1.5 }));
        // إخفاء الـ cursor و الـ robot على الموبايل
        if (window.innerWidth > 768) {
            document.addEventListener('mousemove', (e) => gsap.to('.cursor', { x: e.clientX - 10, y: e.clientY - 10, duration: 0.1 }));
            gsap.to("#design-robot", { x: "random(-300, 300)", y: "random(-200, 200)", duration: 3, repeat: -1, yoyo: true });
        } else {
            document.querySelector('.cursor').style.display = 'none';
            document.getElementById('design-robot').style.display = 'none';
            document.body.style.cursor = 'auto'; // إرجاع السهم العادي
        }

        // 2. Google Script URL
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwXpcCrjT4iTld2UYdmJksa4K5d47f9Gcc183PRimhbxOVgOI843mYOf2CIq0ccAkxcvA/exec";

        // 3. Handle Form Submission
        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = this.querySelector('button');
            btn.innerText = "Sending...";
            
            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: new FormData(this)
            })
            .then(() => {
                alert('تم استلام طلبك بنجاح! هنكلمك على الواتساب قريب جداً.');
                this.reset();
                btn.innerText = "Send Message";
            })
            .catch(() => {
                alert('تم إرسال الطلب!');
                this.reset();
                btn.innerText = "Send Message";
            });
        });

        // 4. Scroll to Form Logic
        function scrollToPricing(service) {
            document.getElementById('pricing-title').innerText = "Start: " + service;
            document.getElementById('hidden-service-field').value = service;
            gsap.to(window, { duration: 1, scrollTo: { y: "#pricing-section", offsetY: 50 }, ease: "power4.inOut" });
        }

        // 5. Comments
        const commentsData = [
            {name: "Ahmed Ali", text: "Great work!"}, {name: "Sara Mahmoud", text: "Detail is insane."}, {name: "Omar Hassan", text: "Understood my vision."}, {name: "Layla Youssef", text: "Fast delivery."},
            {name: "Mazen Adel", text: "شغل ممتاز جداً."}, {name: "Nada Samir", text: "تصميمات تحفة."}, {name: "Tarek Fathy", text: "مجهود رائع."}, {name: "Dina Mansour", text: "أفضل من المتوقع."}
        ];
        const box = document.getElementById('marquee-box');
        [...commentsData, ...commentsData, ...commentsData].forEach(c => {
            box.innerHTML += `<div class="comment-card"><strong>${c.name}</strong><p>${c.text}</p></div>`;
        });

        // 6. Title Scramble
        const title = document.getElementById('hero-title');
        const phrases = ["WE DESIGN BRANDS.", "WE BUILD IDENTITIES.", "WE CREATE IMPACT."];
        let pIdx = 0;
        setInterval(() => {
            pIdx = (pIdx + 1) % phrases.length;
            const target = phrases[pIdx];
            let iter = 0;
            const int = setInterval(() => {
                title.innerText = target.split("").map((l, i) => i < iter ? target[i] : String.fromCharCode(65 + Math.random()*26)).join("");
                if(iter >= target.length) clearInterval(int);
                iter += 1/3;
            }, 30);
        }, 4000);
    </script>
</body>
</html>
